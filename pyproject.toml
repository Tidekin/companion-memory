[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "companion-memory-reference"
version = "0.1.0"
description = "Companion Core memory source snapshots, reproducible evaluation materials and executable examples"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pydantic==2.14.1"]

[project.urls]
Repository = "https://github.com/Tidekin/companion-memory"
Upstream = "https://github.com/Tidekin/companion-core"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/companion_memory"]

[tool.ruff]
line-length = 100
exclude = ["reference", "benchmarks", "evaluations", ".venv", ".local"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
